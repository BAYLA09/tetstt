# Auto-deploy storefront to Vercel on push to main (no EasyPanel).
# One-time setup: https://vercel.com/new → import repo, root = frontend
# Then add GitHub secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# (Vercel → Project Settings → General → Project ID; Team Settings → Org ID; Account → Tokens)

name: Deploy frontend (Vercel)

on:
  push:
    branches:
      - main
      - production-fix-v2
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend-vercel.yml"
  workflow_dispatch:

concurrency:
  group: vercel-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.layalibeauty.shop
          NEXT_PUBLIC_ORDER_USE_SAME_ORIGIN_PROXY: "false"
          NEXT_PUBLIC_APP_BUILD_MARKER: layalibeauty-storefront
          NEXT_PUBLIC_GIT_COMMIT: ${{ github.sha }}
          NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}
          NEXT_PUBLIC_BUILD_TIME: ${{ github.event.head_commit.timestamp }}
        run: npm ci && npm run build

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: frontend
          vercel-args: "--prod"
        continue-on-error: true

      - name: Vercel secrets missing hint
        if: failure()
        run: |
          echo "::notice::Add VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID in GitHub repo secrets,"
          echo "or import the repo at https://vercel.com/new (root=frontend). See docs/DEPLOY_SANS_EASYPANEL.md"
