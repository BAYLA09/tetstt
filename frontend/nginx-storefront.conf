# Nginx serves /public and /_next/static directly — bypasses Node for multi-MB images.
# Next.js listens on 127.0.0.1:3001; EasyPanel still hits port 3000 here.

server {
    listen 3000;
    server_name _;

    client_max_body_size 4m;
    sendfile on;
    tcp_nopush on;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    location /_next/static/ {
        alias /app/.next/static/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /products/ {
        alias /app/public/products/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        access_log off;
        try_files $uri =404;
    }

    location /merchant/ {
        alias /app/public/merchant/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        access_log off;
        try_files $uri =404;
    }

    location = /img-diffuser-card.webp {
        alias /app/public/img-diffuser-card.webp;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        access_log off;
    }

    location = /img-diffuser-card.png {
        alias /app/public/img-diffuser-card.png;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        access_log off;
    }

    location ~ ^/(icon\.svg|favicon\.ico|globe\.svg|file\.svg|window\.svg|vercel\.svg|next\.svg)$ {
        root /app/public;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
